# Runs the unit tests and the installer tests on macOS 26, for pull requests, pushes to main and version tags.
name: Tests

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Show the Swift version
        run: swift --version

      - name: Run the unit tests
        run: scripts/test.sh
        env:
          # The runner has no user at the keyboard, so the panel tests may take key status.
          TOUCHGLASS_FOCUS_TESTS: "1"

      - name: Run the installer tests
        run: scripts/test-installer.sh

      - name: Build the app
        run: scripts/build-app.sh
